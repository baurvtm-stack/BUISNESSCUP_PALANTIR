services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: ${E2E_DB_PASSWORD:?generated by e2e/run.mjs}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -h 127.0.0.1"]
      interval: 1s
      timeout: 3s
      retries: 60
    tmpfs:
      - /var/lib/postgresql/data
  api:
    image: postgrest/postgrest:v14.1
    environment:
      PGRST_DB_URI: postgres://postgres:${E2E_DB_PASSWORD}@db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${E2E_JWT_SECRET:?generated by e2e/run.mjs}
      PGRST_ADMIN_SERVER_PORT: "3001"
    depends_on:
      db:
        condition: service_healthy
  gateway:
    image: nginx:1.28-alpine
    ports:
      - "127.0.0.1::80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health"]
      interval: 1s
      timeout: 3s
      retries: 60
